<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>ALI GAMES PS5 - Foto Fix Nama Asli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.header{position:relative;background:#000;min-height:470px;display:flex;align-items:flex-start;padding-top:48px;overflow:hidden}
.bg-spotlight{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 30% 20%, rgba(80,80,120,0.25), transparent 60%), #000;opacity:0.9}
.bg-overlay{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%)}
.white-lines-v{position:absolute;right:8%;top:8%;bottom:5%;width:180px;z-index:7;display:flex;justify-content:center;pointer-events:none}
.white-line-v{position:relative;width:2px;height:100%}
.white-line-v::before{content:'';position:absolute;left:50%;top:6%;bottom:8%;width:2px;transform:translateX(-50%);background:linear-gradient(180deg, transparent, rgba(255,255,255,0.75) 28%, #fff 48%, rgba(255,255,255,0.7) 68%, transparent);box-shadow:0 0 2px #fff, 0 0 8px rgba(255,255,255,0.6), 0 0 18px rgba(255,255,255,0.2);animation:blinkBareng 3s ease-in-out infinite}
.white-line-v.left{transform:rotate(-4deg);margin-right:26px}
.white-line-v.right{transform:rotate(4deg);margin-left:26px}
@keyframes blinkBareng{0%,100%{opacity:0.18}18%{opacity:0.85}35%{opacity:1}52%{opacity:1}75%{opacity:0.35}}
.ps-rain{position:fixed;top:0;left:0;width:100%;height:100vh;pointer-events:none;z-index:5;opacity:0.16}
.ps-drop{position:absolute;top:-80px;animation:fall linear infinite;color:#fff;font-weight:900;text-shadow:0 0 6px rgba(255,255,255,0.5)}
@keyframes fall{0%{transform:translateY(-100px) rotate(0deg) scale(0.8);opacity:0}10%{opacity:0.55}85%{opacity:0.25}100%{transform:translateY(110vh) translateX(30px) rotate(360deg) scale(1.1);opacity:0}}
.bokeh{position:absolute;width:4px;height:4px;background:radial-gradient(circle, rgba(255,220,120,0.85) 0%, rgba(255,200,80,0.25) 50%, transparent 70%);border-radius:50%;pointer-events:none;z-index:4;animation:bokehFloat 12s ease-in-out infinite}
@keyframes bokehFloat{0%,100%{transform:translateY(0);opacity:0.3}50%{transform:translateY(-18px);opacity:0.7}}
.content{position:relative;z-index:10;padding:24px 20px 28px;max-width:760px;width:100%}
.brand h1{font-size:26px;font-weight:900;letter-spacing:-0.5px}
.big{margin-top:28px;font-size:46px;font-weight:900;line-height:0.86;text-transform:uppercase;letter-spacing:-1.2px}
.big .l1{color:#C8C8C8;display:block}
.big .l2{display:block;margin-top:4px}
.big .l2 .w{color:#C8C8C8}
.big .l2 .g{color:#8a8a8a;margin-left:7px}
.info{margin-top:22px;display:flex;gap:11px;align-items:flex-start}
.ic{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:14px}
.info-text .m{font-size:13px;font-weight:700}
.info-text .s{font-size:11px;opacity:0.6;margin-top:2px}
.section{position:relative;z-index:10;padding:16px 12px 100px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-head h2{font-size:14px;font-weight:800}
.pill{background:#151515;border:1px solid #222;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;background:#111;border:1px solid #222;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{background:#111;border-radius:12px;overflow:hidden;border:1px solid #222;cursor:pointer;transition:0.2s}
.card.on{border-color:#0070ff;box-shadow:0 0 0 2px #0070ff}
.cover{position:relative;aspect-ratio:3/4;background:#0a0a0a;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center;background:#151515}
.cover .fallback.hidden{display:none}
.fallback .ico{font-size:30px;margin-bottom:6px}
.fallback .tt{font-size:11px;font-weight:800;line-height:1.2}
.fallback .gg{font-size:9px;opacity:0.6;margin-top:4px}
.num{position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.85);padding:2px 6px;border-radius:6px;font-size:10px;font-weight:700;z-index:2}
.foot{padding:8px}
.ft{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc{font-size:9px;opacity:0.55}
.sticky{position:fixed;bottom:0;left:0;right:0;background:#0f0f0f;border-top:1px solid #222;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:20}
.wa{background:#0070ff;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px}
.sync-status{background:#111;border:1px dashed #333;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:11px;line-height:1.5}
</style>
</head>
<body>
<div class="header">
<div class="bg-spotlight"></div>
<div class="bg-overlay"></div>
<div class="white-lines-v"><div class="white-line-v left"></div><div class="white-line-v right"></div></div>
<div class="ps-rain" id="rain"></div>
<div id="bokehBox" style="position:absolute;inset:0;z-index:4;pointer-events:none"></div>
<div class="content">
<div class="brand"><h1>ALI GAMES PS5</h1></div>
<div class="big"><span class="l1">ALI GAMES</span><span class="l2"><span class="w">PS5</span><span class="g">LIST</span></span></div>
<div class="info"><div class="ic">✔</div><div class="info-text"><div class="m">WA: 0895708629977</div><div class="s" id="syncInfo">Sinkron nama asli...</div></div></div>
</div>
</div>

<div class="section">
<div class="sync-status" id="syncStatus">⏳ Cek folder covers/ di GitHub...</div>
<div class="sec-head"><h2>List Game PS5 - Nama Asli</h2><div class="pill" id="topCnt">0 game</div></div>
<div class="search"><input id="q" placeholder="🔍 Cari game..."><input id="cust" placeholder="Nama pembeli"></div>
<div class="grid" id="grid"></div>
</div>

<div class="sticky"><div id="cnt" style="font-size:12px;font-weight:600">Memuat...</div><button class="wa" onclick="openEditor()">🛒 Order</button></div>

<div id="orderEditor" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:99;align-items:center;justify-content:center;padding:20px">
<div style="background:#151515;border:1px solid #222;border-radius:16px;max-width:480px;width:100%;padding:16px">
<div style="font-weight:800;margin-bottom:8px;color:#fff;font-size:14px">Pesanan - Ali Games PS5</div>
<textarea id="orderText" style="width:100%;min-height:200px;background:#0a0a0a;border:1px solid #222;color:#fff;padding:10px;border-radius:10px;font-size:12px;resize:vertical"></textarea>
<div style="display:flex;gap:8px;margin-top:12px"><button class="wa" onclick="sendWA()">Kirim WA</button><button class="wa" style="background:#222;color:#fff" onclick="closeEditor()">Tutup</button></div>
</div></div>

<script>
let sel = new Set();
let allGames = [];

function genreIcon(t){
  const s=t.toLowerCase();
  if(s.includes('god of war')||s.includes('spider')||s.includes('mortal')||s.includes('resident')) return '🎮';
  if(s.includes('grand')||s.includes('harvest')||s.includes('jurassic')||s.includes('monster')||s.includes('world')) return '🌍';
  if(s.includes('fortnite')||s.includes('destroy')) return '🔫';
  if(s.includes('final fantasy')||s.includes('elden')) return '⚔️';
  return '🎯';
}

function coverHtml(g,idx){
  const title = g.title;
  const cover = g.cover;
  const icon = genreIcon(title);
  return `<div class="cover">
    <img src="${cover}" alt="${title}" loading="lazy"
      onload="this.nextElementSibling.classList.add('hidden')"
      onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">
    <div class="fallback"><div class="ico">${icon}</div><div class="tt">${title}</div><div class="gg">${title.substring(0,18)}</div></div>
    <div class="num">${idx+1}</div>
  </div>`;
}

function render(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  const filtered = allGames.map((g,i)=>({g,i})).filter(({g})=> !q || g.title.toLowerCase().includes(q));
  filtered.forEach(({g,i})=>{
    const on = sel.has(i);
    const card = document.createElement('div');
    card.className = 'card'+(on?' on':'');
    card.innerHTML = coverHtml(g,i)+`<div class="foot"><div class="ft">${g.title}</div><div class="fc">${g.title.substring(0,22)}</div></div>`;
    card.onclick = ()=>{ if(sel.has(i)) sel.delete(i); else sel.add(i); render(); };
    grid.appendChild(card);
  });
  document.getElementById('cnt').textContent = sel.size>0 ? sel.size+' dipilih' : filtered.length+' game - nama asli';
  document.getElementById('topCnt').textContent = filtered.length+' game';
}

async function loadFromGitHub(){
  const statusEl = document.getElementById('syncStatus');
  try{
    // Ambil langsung dari GitHub API - ini yang kamu upload dengan spasi
    const res = await fetch('https://api.github.com/repos/ps4Aligames/listps5/contents/covers');
    if(!res.ok) throw new Error(res.status);
    const files = await res.json();
    const imageFiles = files.filter(f=>f.type==='file' && /\.(jpe?g|png|webp)$/i.test(f.name));
    
    allGames = imageFiles.map(f=>{
      const title = f.name.replace(/\.(jpg|jpeg|png|webp)$/i,'');
      // encode untuk spasi dan karakter khusus seperti ' ! 
      const encodedPath = 'covers/' + encodeURIComponent(f.name).replace(/%20/g, '%20');
      // Untuk GitHub Pages, pakai path relatif dengan encode
      return {
        file: f.name,
        title: title,
        genre: 'PS5 Game',
        cover: encodedPath
      };
    }).sort((a,b)=>a.title.localeCompare(b.title));

    statusEl.innerHTML = `✅ Sinkron sukses: <b>${allGames.length} foto</b> ditemukan di folder covers/ dengan nama asli (ada spasi). Dekorasi asli tetap.`;
    document.getElementById('syncInfo').textContent = `${allGames.length} foto sinkron - nama asli`;
    render();
  }catch(e){
    statusEl.innerHTML = `⚠️ Gagal ambil dari API GitHub (${e.message}), pakai fallback local games.json.`;
    // fallback ke games.json lama
    try{
      const r = await fetch('games.json');
      const j = await r.json();
      allGames = j.map(g=>({title:g.title, cover:g.cover, genre:g.genre, file:g.file}));
      render();
    }catch(err){
      statusEl.innerHTML += '<br>Fallback juga gagal: '+err.message;
    }
  }
}

function openEditor(){
  const cust = document.getElementById('cust').value.trim();
  if(!cust){ alert('Isi nama pembeli dulu'); return; }
  if(sel.size==0){ alert('Pilih game dulu'); return; }
  let t='Halo Ali Games PS5, order:\n\n';
  Array.from(sel).forEach(i=>{ t+=(i+1)+'. '+allGames[i].title+'\n'; });
  t+='\nTotal: '+sel.size+' game\nNama: '+cust;
  document.getElementById('orderText').value=t;
  document.getElementById('orderEditor').style.display='flex';
}
function sendWA(){ const m=document.getElementById('orderText').value.trim(); if(!m) return; window.open('https://wa.me/62895708629977?text='+encodeURIComponent(m),'_blank'); }
function closeEditor(){ document.getElementById('orderEditor').style.display='none'; }
document.getElementById('q').addEventListener('input', render);
loadFromGitHub();

function createRain(){
  const el=document.getElementById('rain');
  const syms=['△','○','×','□'];
  for(let i=0;i<20;i++){
    const d=document.createElement('div');
    d.className='ps-drop';
    d.textContent=syms[Math.floor(Math.random()*4)];
    d.style.left=(Math.random()*100)+'%';
    d.style.animationDelay=(Math.random()*8)+'s';
    d.style.animationDuration=(9+Math.random()*6)+'s';
    d.style.fontSize=(10+Math.random()*10)+'px';
    el.appendChild(d);
  }
}
createRain();
function createBokeh(){
  const box=document.getElementById('bokehBox');
  for(let i=0;i<8;i++){
    const b=document.createElement('div');
    b.className='bokeh';
    b.style.left=(10+Math.random()*80)+'%';
    b.style.top=(20+Math.random()*60)+'%';
    b.style.animationDelay=(Math.random()*5)+'s';
    b.style.animationDuration=(8+Math.random()*6)+'s';
    const s=2+Math.random()*3;
    b.style.width=s+'px'; b.style.height=s+'px';
    box.appendChild(b);
  }
}
createBokeh();
</script>
</body></html>
