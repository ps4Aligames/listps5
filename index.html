.white-lines-v{position:absolute;right:8%;top:8%;bottom:5%;width:180px;z-index:7;display:flex;justify-content:center;pointer-events:none}
.white-line-v{position:relative;width:2px;height:100%}
.white-line-v::before{content:'';position:absolute;left:50%;top:6%;bottom:8%;width:2px;transform:translateX(-50%);background:linear-gradient(180deg, transparent, rgba(255,255,255,0.75) 28%, #fff 48%, rgba(255,255,255,0.7) 68%, transparent);box-shadow:0 0 2px #fff, 0 0 8px rgba(255,255,255,0.6), 0 0 18px rgba(255,255,255,0.2);animation:blinkBareng 3s ease-in-out infinite}

@keyframes blinkBareng{0%,100%{opacity:0.18}18%{opacity:0.85}35%{opacity:1}52%{opacity:1}75%{opacity:0.35}}
.ps-rain{position:fixed;top:0;left:0;width:100%;height:100vh;pointer-events:none;z-index:5;opacity:0.16}
.ps-drop{position:absolute;top:-80px;animation:fall linear infinite;color:#fff;font-weight:900;text-shadow:0 0 6px rgba(255,255,255,0.5)}
@keyframes fall{0%{transform:translateY(-100px) rotate(0deg) scale(0.8);opacity:0}10%{opacity:0.55}85%{opacity:0.25}100%{transform:translateY(110vh) translateX(30px) rotate(360deg) scale(1.1);opacity:0}}
.bokeh{position:absolute;width:4px;height:4px;background:radial-gradient(circle, rgba(255,220,120,0.85) 0%, rgba(255,200,80,0.25) 50%, transparent 70%);border-radius:50%;pointer-events:none;z-index:4;animation:bokehFloat 12s ease-in-out infinite}

.content{position:relative;z-index:10;padding:24px 20px 28px;max-width:760px;width:100%}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}

.cover{position:relative;aspect-ratio:3/4;background:#0a0a0a;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center;background:#151515}

.wa{background:#0070ff;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px}
.sync-status{background:#111;border:1px dashed #333;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:11px;line-height:1.5}

</style>

  {"file": "dragon-ball-fighterz.jpg", "title": "Dragon Ball Fighterz", "genre": "Fighting", "cover": "covers/dragon-ball-fighterz.jpg"},
  {"file": "gran-turismo-7.jpg", "title": "Gran Turismo 7", "genre": "Racing", "cover": "covers/gran-turismo-7.jpg"},
  {"file": "need-for-speed-heat.jpg", "title": "Need For Speed Heat", "genre": "Racing", "cover": "covers/need-for-speed-heat.jpg"},
  {"file": "f1-23.jpg", "title": "F1 23", "genre": "Racing", "cover": "covers/f1-23.jpg"},
  {"file": "motogp-23.jpg", "title": "MotoGP 23", "genre": "Racing", "cover": "covers/motogp-23.jpg"},
  {"file": "fifa-24.jpg", "title": "FIFA 24", "genre": "Sports", "cover": "covers/fifa-24.jpg"},
  {"file": "efootball-24.jpg", "title": "eFootball 24", "genre": "Sports", "cover": "covers/efootball-24.jpg"},
  {"file": "nba-2k24.jpg", "title": "NBA 2K24", "genre": "Sports", "cover": "covers/nba-2k24.jpg"},
  {"file": "wwe-2k23.jpg", "title": "WWE 2K23", "genre": "Sports", "cover": "covers/wwe-2k23.jpg"},
  {"file": "minecraft.jpg", "title": "Minecraft", "genre": "Family / Casual", "cover": "covers/minecraft.jpg"},
  {"file": "lego-star-wars.jpg", "title": "Lego Star Wars", "genre": "Family / Casual", "cover": "covers/lego-star-wars.jpg"},
  {"file": "crash-bandicoot-4.jpg", "title": "Crash Bandicoot 4", "genre": "Action Adventure", "cover": "covers/crash-bandicoot-4.jpg"},
  {"file": "ratchet-and-clank.jpg", "title": "Ratchet and Clank Rift Apart", "genre": "Action Adventure", "cover": "covers/ratchet-and-clank.jpg"},
  {"file": "fall-guys.jpg", "title": "Fall Guys", "genre": "Family / Casual", "cover": "covers/fall-guys.jpg"}
];

let sel = new Set();
let existingCovers = new Set(); // akan diisi dari GitHub API
let syncDone = false;

function genreIcon(g){
  if(g.includes('Action')) return '🎮';
  if(g.includes('Open')) return '🌍';
  if(g.includes('FPS')) return '🔫';
  if(g.includes('RPG')) return '⚔️';
  if(g.includes('Fighting')) return '👊';
  if(g.includes('Racing')) return '🏎️';
  if(g.includes('Sports')) return '⚽';
  return '🎯';
}

function coverHtml(g,idx){
  const title = g.title || '';
  const cover = g.cover || '';
  const genre = g.genre || '';
  const icon = genreIcon(genre);
  const fileName = cover.split('/').pop();
  const exists = syncDone ? existingCovers.has(fileName.toLowerCase()) : true;
  const badge = syncDone ? (exists ? '<div class="badge-ok">ADA</div>' : '<div class="badge-missing">BELUM</div>') : '';
  
  return `<div class="cover">
    <img src="${cover}" alt="${title}" loading="lazy"
      onload="this.nextElementSibling.classList.add('hidden'); this.parentElement.querySelector('.badge-missing')?.remove()"
      onerror="
        // coba png
        if(this.dataset.retry!=='1'){ this.dataset.retry='1'; if(this.src.endsWith('.jpg')){ this.src=this.src.replace('.jpg','.png'); return; } }
        // kalau tetap gagal -> placeholder + tetap tampil fallback cantik
        this.style.display='none';
        this.nextElementSibling.classList.remove('hidden');
      ">
    <div class="fallback"><div class="ico">${icon}</div><div class="tt">${title}</div><div class="gg">${genre.substring(0,18)}</div></div>
    <div class="num">${idx+1}</div>
    ${badge}
  </div>`;
}

function render(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  const filtered = GAMES.map((g,i)=>({g,i})).filter(({g})=> !q || g.title.toLowerCase().includes(q) || g.genre.toLowerCase().includes(q));
  filtered.forEach(({g,i})=>{
    const on = sel.has(i);
    const card = document.createElement('div');
    card.className = 'card'+(on?' on':'');
    card.innerHTML = coverHtml(g,i)+`<div class="foot"><div class="ft">${g.title}</div><div class="fc">${g.genre.substring(0,18)}</div></div>`;
    card.onclick = ()=>{ if(sel.has(i)) sel.delete(i); else sel.add(i); render(); };
    grid.appendChild(card);
  });
  document.getElementById('cnt').textContent = sel.size>0 ? sel.size+' dipilih' : filtered.length+' game';
  document.getElementById('topCnt').textContent = filtered.length+' game';
  if(syncDone){
    document.getElementById('syncStatus').innerHTML = `✅ Sinkron: <b>${existingCovers.size} foto ada</b> di folder covers/ | <b>${GAMES.length - existingCovers.size} belum ada</b> (tampil placeholder) | Dekorasi tetap jalan`;
    document.getElementById('syncInfo').textContent = `${existingCovers.size} foto sinkron - dekorasi aman`;
  }
}

// Sinkronisasi: cek isi folder covers di GitHub via API
async function syncCovers(){
  try{
    const res = await fetch('https://api.github.com/repos/ps4Aligames/listps5/contents/covers');
    if(!res.ok) throw new Error('API fail '+res.status);
    const files = await res.json();
    existingCovers = new Set(files.filter(f=>f.type==='file').map(f=>f.name.toLowerCase()));
    syncDone = true;
    render();
  }catch(e){
    // kalau API gagal (rate limit / offline) -> tetap render dengan placeholder logic
    console.log('Sync API gagal, pakai fallback:', e);
    syncDone = true;
    existingCovers = new Set(); // anggap belum tau, tapi render tetap jalan dengan onerror fallback
    document.getElementById('syncStatus').innerHTML = `⚠️ API GitHub limit, pakai mode fallback: foto yang ada tetap tampil, yang belum tampil placeholder. Dekorasi tetap aman. Error: ${e.message}`;
    render();
  }
}

function openEditor(){
  const cust = document.getElementById('cust').value.trim();
  if(!cust){ alert('Isi nama pembeli dulu'); return; }
  if(sel.size==0){ alert('Pilih game dulu'); return; }
  let t='Halo Ali Games PS5, order:\n\n';
  Array.from(sel).forEach(i=>{ t+=(i+1)+'. '+GAMES[i].title+'\n'; });
  t+='\nTotal: '+sel.size+' game\nNama: '+cust;
  document.getElementById('orderText').value=t;
  document.getElementById('orderEditor').style.display='flex';
}
function sendWA(){ const m=document.getElementById('orderText').value.trim(); if(!m) return; window.open('https://wa.me/62895708629977?text='+encodeURIComponent(m),'_blank'); }
function closeEditor(){ document.getElementById('orderEditor').style.display='none'; }
document.getElementById('q').addEventListener('input', render);
render();
syncCovers();

// Dekorasi tetap
function createRain(){
  const el=document.getElementById('rain');
  const syms=['△','○','×','□'];
  for(let i=0;i<20;i++){
    const d=document.createElement('div');
    d.className='ps-drop';
    d.textContent=syms[Math.floor(Math.random()*4)];
    d.style.left=(Math.random()*100)+'%';
    d.style.animationDelay=(Math.random()*8)+'s';
    d.style.animationDuration=(9+Math.random()*6)+'s';
    d.style.fontSize=(10+Math.random()*10)+'px';
    el.appendChild(d);
  }
}
createRain();
function createBokeh(){
  const box=document.getElementById('bokehBox');
  for(let i=0;i<8;i++){
    const b=document.createElement('div');
    b.className='bokeh';
    b.style.left=(10+Math.random()*80)+'%';
    b.style.top=(20+Math.random()*60)+'%';
    b.style.animationDelay=(Math.random()*5)+'s';
    b.style.animationDuration=(8+Math.random()*6)+'s';
    const s=2+Math.random()*3;
    b.style.width=s+'px'; b.style.height=s+'px';
    box.appendChild(b);
  }
}
createBokeh();
</script>
